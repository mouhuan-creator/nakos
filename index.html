<style>
/* ================================================================
   一、配色系统
   ================================================================ */

:root {
  --bg: #f5f5f5;
  --card-bg: #ffffff;
  --card-border: #eaeaea;
  --card-border-hover: #d0d0d0;
  --text: #1a1a1a;

}

   ================================================================ */

/* ================================================================

.domain-item:nth-child(1)  { animation-delay: 0.02s; }

.domain-item:nth-child(4)  { animation-delay: 0.11s; }

}

.toast {

<script>
/* ================================================================
   ██████  初始化  ██████
   以下为程序启动逻辑，一般无需修改
   ================================================================ */

// ================================================================
// 工具函数
// ================================================================

function fmt(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~(.*?)~~/g, '<del>$1</del>')
    .replace(/`(.*?)`/g, '<code>$1</code>')
    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
    .replace(/\n/g, '<br>');
}

function generateInitialSVG(initial, size) {
  var s = size || 64;
  var bg = '%23ffffff';
  var fg = '%23000000';
  var radius = s * 0.15;
  var fontSize = s * 0.55;
  return 'data:image/svg+xml,' +
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + ' ' + s + '">' +
    '<rect width="' + s + '" height="' + s + '" rx="' + radius + '" fill="' + bg + '"/>' +
    '<text x="50%" y="52%" font-size="' + fontSize + '" ' +
    'font-weight="700" font-family="Georgia,serif" ' +
    'text-anchor="middle" dominant-baseline="central" fill="' + fg + '">' +
    (initial || 'N') +
    '</text>' +
    '</svg>';
}

// ================================================================
// Toast 复制反馈
// ================================================================

function showToast() {
  var existing = document.querySelector('.toast');
  if (existing) {
    existing.remove();
  }

  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = '已复制。';
  document.body.appendChild(el);

  setTimeout(function() {
    if (el.parentNode) {
      el.remove();
    }
  }, 1700);
}

function copyToClipboard(text) {
  if (!text || text.trim() === '') return;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showToast).catch(function() {
      fallbackCopy(text);
    });
    return;
  }

  fallbackCopy(text);
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;z-index:-1;';
  document.body.appendChild(ta);

  try {
    ta.select();
    ta.setSelectionRange(0, text.length);
    if (document.execCommand('copy')) {
      showToast();
    }
  } catch (err) {}

  document.body.removeChild(ta);
}

// ================================================================
// Favicon & OG Image
// ================================================================

function setupFaviconAndOG() {
  var initial = S.title.charAt(0).toUpperCase();
  var faviconLink = document.querySelector('link[rel="icon"]');
  faviconLink.href = generateInitialSVG(initial, 64);
  var ogImageMeta = document.querySelector('meta[property="og:image"]');
  if (!ogImageMeta) {
    ogImageMeta = document.createElement('meta');
    ogImageMeta.setAttribute('property', 'og:image');
    document.head.appendChild(ogImageMeta);
  }
  ogImageMeta.content = generateInitialSVG(initial, 400);
}

// ================================================================
// 主题系统
// ================================================================

var THEME_MODES = ['auto', 'light', 'dark'];
var currentMode = 'auto';
var THEME_ICONS = {
  auto: '↻',
  light: '☀',
  dark: '☾'
};
var THEME_LABELS = {
  auto: '自动',
  light: '亮色',
  dark: '暗色'
};

function getSystemTheme() {
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(mode) {
  currentMode = mode;
  var effective = mode === 'auto' ? getSystemTheme() : mode;
  document.documentElement.setAttribute('data-theme', effective);
  localStorage.setItem('theme', mode);
  document.getElementById('themeIcon').textContent = THEME_ICONS[mode] || '☀';
  document.getElementById('themeLabel').textContent = THEME_LABELS[mode] || '亮色';
}

function cycleTheme() {
  var idx = THEME_MODES.indexOf(currentMode);
  applyTheme(THEME_MODES[(idx + 1) % THEME_MODES.length]);
}

var savedTheme = localStorage.getItem('theme') || 'auto';
applyTheme(savedTheme);

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
  if (currentMode === 'auto') applyTheme('auto');
});

document.getElementById('themeToggle').addEventListener('click', cycleTheme);

document.addEventListener('keydown', function(e) {
  if ((e.key === 't' || e.key === 'T') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    cycleTheme();
  }
  if (e.key === 'Escape') {
    document.querySelectorAll('.popup.active').forEach(function(p) {
      p.classList.remove('active');
    });
  }
});

// ================================================================
// 渲染域名列表
// ================================================================

function renderDomains() {
  var container = document.getElementById('domainList');
  if (!container) return;

  var sorted = domains.slice().sort(function(a, b) {
    return (a.price === '已售' ? 1 : 0) - (b.price === '已售' ? 1 : 0);
  });

  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var d = sorted[i];
    var isSold = d.price === '已售';
    html += '<div class="domain-item' + (isSold ? ' sold' : '') + '">';
    html += '  <div class="domain-header">';
    html += '    <div class="domain-main">';
    html += '      <a href="https://' + d.name + '" target="_blank" class="domain-name" rel="noopener noreferrer">' + d.name + '</a>';
    html += '      <div class="domain-intro">' + d.intro + '</div>';
    html += '    </div>';
    html += '    <span class="domain-price">' + d.price + '</span>';
    html += '    <span class="expand-icon">▶</span>';
    html += '  </div>';
    html += '  <div class="domain-detail">';
    html += '    <div>';
    html += '      <div class="detail-content">' + fmt(d.detail) + '</div>';
    html += '    </div>';
    html += '  </div>';
    html += '</div>';
  }
  container.innerHTML = html;
}

// ================================================================
// 交互事件
// ================================================================

document.addEventListener('click', function(e) {
  // 域名跳转
  if (e.target.closest('.domain-name')) {
    return;
  }

  // 点击联系方式复制
  var contactItem = e.target.closest('.contact-item');
  if (contactItem) {
    var text = contactItem.getAttribute('data-copy');
    if (text) {
      e.stopPropagation();
      copyToClipboard(text);
    }
    return;
  }

  // 展开/折叠
  var header = e.target.closest('.domain-header');
  if (header) {
    var item = header.closest('.domain-item');
    if (item) {
      var wasActive = item.classList.contains('active');
      document.querySelectorAll('.domain-item.active').forEach(function(el) {
        if (el !== item) el.classList.remove('active');
      });
      if (!wasActive) {
        item.classList.add('active');
      } else {
        item.classList.remove('active');
      }
    }
    return;
  }

  // 点击弹窗外部关闭
  var popup = e.target.closest('.popup.active');
  if (popup && !e.target.closest('.popup-content')) {
    popup.classList.remove('active');
  }
});
